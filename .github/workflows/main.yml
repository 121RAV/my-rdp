name: Free Windows RDP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Create User
      shell: cmd
      run: |
        net user runneradmin MyPassword123# /add /Y
        net localgroup administrators runneradmin /add

    - name: Start Tunnel
      shell: cmd
      run: |
        curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip -o bore.zip
        tar -xf bore.zip
        bore.exe local 3389 --to bore.pub
